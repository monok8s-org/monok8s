apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: harbor.monok8s.internal/monok8s/api:latest
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: api-secrets     # populated by ExternalSecret → Vault
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  # Canary strategy per Issue #21:
  #   1. Roll out 25% of replicas with the new image
  #   2. Pause 30s (no Kayenta analysis in 0.1.0 — that's a 0.2.0 add)
  #   3. Roll out the remaining 75%
  # Kayenta + AnalysisTemplate integration deferred to 0.2.0 per the
  # AC's "Kayenta integration deferred" note.
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 30s
        - setWeight: 100
