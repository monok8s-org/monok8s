# Minimal CRD for argoproj.io/v1alpha1 Workflow.
#
# Used by the L2 workflow_itest target so the test apiserver accepts
# Workflow CRs submitted by `MintTenantVaultKeyActivity` +
# `RunMigrationsActivity` (activities_argo.go). The test does NOT run
# a real Argo Workflows controller — the sidecar goroutine in
# `driver_test.go` simulates the onExit NATS-publish step. The CR
# itself is never reconciled, so this CRD intentionally has a
# permissive schema (`x-kubernetes-preserve-unknown-fields: true`)
# rather than vendoring the full ~3K-line upstream Workflow schema.
#
# If a future L2 test needs validated Workflow CR schemas (e.g. to
# assert the worker submits a structurally-correct CR for the real
# Argo controller to reconcile), swap this for a vendored upstream
# CRD sliced from `platform/argo-workflows/bootstrap.yaml`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.argoproj.io
spec:
  group: argoproj.io
  scope: Namespaced
  names:
    plural: workflows
    singular: workflow
    kind: Workflow
    listKind: WorkflowList
    shortNames:
      - wf
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
