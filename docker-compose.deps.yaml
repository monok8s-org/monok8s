version: "3.9"

# Local dependency stack for fast-mode development.
# Does NOT include the application services (api, workers, frontend).
# Start with: docker compose -f docker-compose.deps.yaml up -d

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monok8s
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Workflow engine ──────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tools/scripts/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml

  temporal-ui:
    image: temporalio/ui:2.26
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # ── Secrets ─────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.17
    entrypoint: /bin/sh
    command: /vault-init/init.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./tools/scripts/vault-init.sh:/vault-init/init.sh

  # ── Authorization ────────────────────────────────────────────────────────────
  spicedb:
    image: authzed/spicedb:v1.32
    command: serve --grpc-preshared-key=dev-preshared-key --http-enabled
    ports:
      - "50051:50051"   # gRPC
      - "8443:8443"     # HTTP
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Authentication ───────────────────────────────────────────────────────────
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Feature flags ────────────────────────────────────────────────────────────
  flagd:
    image: ghcr.io/open-feature/flagd:latest
    command: start --uri file:/etc/flagd/flags.json
    ports:
      - "8013:8013"   # gRPC
      - "8014:8014"   # HTTP
    volumes:
      - ./config/flagd:/etc/flagd
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8014/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Metering ─────────────────────────────────────────────────────────────────
  openmeter:
    image: ghcr.io/openmeterio/openmeter:latest
    environment:
      OPENMETER_ADDRESS: 0.0.0.0:8888
      OPENMETER_INGEST_KAFKA_BROKER: ""   # in-memory for local dev
    ports:
      - "8888:8888"

volumes:
  postgres_data:
