# vault-backend ClusterSecretStore — the named SecretStore every
# ExternalSecret in this repo references (existing api.yaml,
# tenant-namespace Composition's db-creds child resource, future
# per-tenant ExternalSecrets, etc.).
#
# Authenticates to Vault via Kubernetes auth. Each consumer namespace's
# default ServiceAccount must be bound to a Vault role (provider-vault
# AuthBackendRole) granting read on the relevant secret/data/* path —
# the per-tenant binding lives in tenant-namespace's Composition under
# vault-policy + vault-role.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # In-cluster Vault dev-mode service exposed by platform/vault.
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Each ESO read happens as the ESO controller's SA. Per-tenant
          # access control is enforced inside Vault by the tenant-namespace
          # Composition's vault-policy + vault-role, scoped by the SA's
          # bound namespaces.
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
