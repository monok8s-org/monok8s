# Grafana datasources — auto-discovered by the chart's sidecar via the
# `grafana_datasource=1` label. AC#3 of #25: datasources configured for
# all three signal types.
#
# All three point at the in-cluster services exposed by the respective
# platform components:
#   - Loki:   logs:3100   (HTTP query API)
#   - Mimir:  mimir:8080  (Prometheus-compatible query API)
#   - Tempo:  tempo:3200  (TraceQL + traceID lookup API)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        isDefault: false
        jsonData:
          # When viewing logs, pivot to traces by clicking on the
          # traceID label. The derivedFields config below extracts
          # the traceID from the OTel-formatted log line.
          derivedFields:
            - name: traceID
              datasourceUid: tempo
              matcherRegex: "trace_id=(\\w+)"
              url: "$${__value.raw}"

      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir.mimir.svc.cluster.local:8080/prometheus
        uid: mimir
        isDefault: true
        jsonData:
          httpMethod: POST
          # Pivot from a metric span to its trace via the
          # exemplar's traceID.
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.tempo.svc.cluster.local:3200
        uid: tempo
        isDefault: false
        jsonData:
          # Trace -> logs jump: filter Loki by traceID label.
          tracesToLogs:
            datasourceUid: loki
            tags: [trace_id]
            mappedTags:
              - key: trace_id
                value: traceID
          # Trace -> metrics jump: filter Mimir by service.
          tracesToMetrics:
            datasourceUid: mimir
            tags: [service.name]
          serviceMap:
            datasourceUid: mimir
