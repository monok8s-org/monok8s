# Install-time admin tenant bootstrap Job (#98a).
#
# Provisions the `system` admin tenant on first cluster install per
# Discussion #76 + Issue #98. Runs `apps/workers/bootstrap` which:
#
#   1. Reads admin email + initialPassword from the
#      install/monok8s-bootstrap-admin Secret.
#   2. Idempotency-checks for existing system XTenant XR (skip if
#      present).
#   3. Submits OnboardTenantWorkflow on the `onboarding` Temporal task
#      queue with TenantID="system". Waits for completion.
#   4. Calls Zitadel mgmt API to create the admin human user.
#   5. Writes the SpiceDB system:monok8s#only_system_can_create_tenants
#      relation for the new user.
#
# Idempotent end-to-end. backoffLimit=6 + restartPolicy=OnFailure
# means transient failures retry; permanent failures (e.g. wrong PAT)
# surface after retries.
#
# Depends on Zitadel + Temporal + SpiceDB + Crossplane being ready
# before this Job runs. ArgoCD `argocd.argoproj.io/sync-wave: "5"`
# annotation places it after their respective installs.

apiVersion: batch/v1
kind: Job
metadata:
  name: monok8s-bootstrap
  namespace: install
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monok8s-bootstrap
        app.kubernetes.io/component: install
    spec:
      restartPolicy: OnFailure
      serviceAccountName: monok8s-bootstrap
      containers:
        - name: bootstrap
          image: harbor.monok8s.internal/monok8s/bootstrap:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: SPICEDB_ENDPOINT
              value: spicedb.spicedb.svc.cluster.local:50051
            - name: SPICEDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spicedb-preshared-key
                  key: token
            - name: SPICEDB_INSECURE
              value: "true"
            - name: ZITADEL_API
              value: http://zitadel.zitadel.svc.cluster.local:8080
            - name: ZITADEL_ADMIN_PAT_FILE
              value: /etc/zitadel/admin-sa/pat
          volumeMounts:
            - name: zitadel-admin-sa
              mountPath: /etc/zitadel/admin-sa
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: zitadel-admin-sa
          secret:
            secretName: zitadel-admin-sa
