# DOCUMENTATION ONLY — operator-applied at install time.
#
# This file shows the expected shape of the `monok8s-bootstrap-admin`
# Secret. The bootstrap Job reads it on first install to seed the
# admin user in Zitadel. NOT committed with real values — operator
# creates this Secret directly before applying the bootstrap-job.
#
#   kubectl create namespace install
#   kubectl -n install create secret generic monok8s-bootstrap-admin \
#       --from-literal=email=admin@example.com \
#       --from-literal=initialPassword=<a strong initial password>
#
# After the Job runs, the admin user is created in Zitadel with the
# email + password from this Secret. The user must rotate the
# password on first login via the standard Zitadel password-change
# flow. The Secret can be deleted post-bootstrap.

apiVersion: v1
kind: Secret
metadata:
  name: monok8s-bootstrap-admin
  namespace: install
type: Opaque
stringData:
  email: admin@example.com
  initialPassword: REPLACE-WITH-A-STRONG-PASSWORD
